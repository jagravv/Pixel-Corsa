<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="threadRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d0610"/>
      <stop offset="0.42" stop-color="#8e1023"/>
      <stop offset="0.7" stop-color="#c1283c"/>
      <stop offset="1" stop-color="#430711"/>
    </linearGradient>
    <linearGradient id="threadDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c0308"/>
      <stop offset="0.5" stop-color="#68101c"/>
      <stop offset="1" stop-color="#26040a"/>
